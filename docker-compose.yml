services:
  postgres:
    image: postgres:16-alpine
    container_name: workly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workly}
      POSTGRES_USER: ${POSTGRES_USER:-workly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workly}
    ports:
      # Host port 5433, not 5432 — this machine has a native PostgreSQL Windows service already
      # bound to 5432, and Docker's port-forward silently loses that conflict. Container-internal
      # port stays 5432; the app talks to it as "postgres:5432" over workly-net either way, so
      # this only affects connecting a DB client (or running the app/tests outside Docker) from
      # the host. Drop this line entirely to keep Postgres container-only.
      - "5433:5432"
    volumes:
      - workly-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workly} -d ${POSTGRES_DB:-workly}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - workly-net

  app:
    # Reuses the existing Dockerfile — still expects target/*.jar to exist, same as your
    # already-built image. Run `./mvnw package -DskipTests` before `docker compose up --build`,
    # or skip the build entirely and point this at your existing image instead:
    #   image: workly:latest      (replace with your actual name:tag — see `docker images`)
    build: .
    container_name: workly-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # "postgres" below is the service name above — Docker's internal DNS resolves it to the
      # container's address on workly-net, no host IP or port-mapping needed between the two.
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-workly}
      DATABASE_USERNAME: ${POSTGRES_USER:-workly}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-workly}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD" , "wget","-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - workly-net

volumes:
  workly-pgdata:

networks:
  workly-net:
    driver: bridge
