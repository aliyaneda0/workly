services:
  postgres:
    image: postgres:16-alpine
    container_name: workly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workly}
      POSTGRES_USER: ${POSTGRES_USER:-workly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workly}
    ports:
      # Host port 5433, not 5432 — this machine has a native PostgreSQL Windows service already
      # bound to 5432, and Docker's port-forward silently loses that conflict. Container-internal
      # port stays 5432; the app talks to it as "postgres:5432" over workly-net either way, so
      # this only affects connecting a DB client (or running the app/tests outside Docker) from
      # the host. Drop this line entirely to keep Postgres container-only.
      - "5433:5432"
    volumes:
      - workly-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workly} -d ${POSTGRES_DB:-workly}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - workly-net

  app:
    # Reuses the existing Dockerfile — still expects target/*.jar to exist, same as your
    # already-built image. Run `./mvnw package -DskipTests` before `docker compose up --build`,
    # or skip the build entirely and point this at your existing image instead:
    #   image: workly:latest      (replace with your actual name:tag — see `docker images`)
    build: .
    container_name: workly-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # "postgres" below is the service name above — Docker's internal DNS resolves it to the
      # container's address on workly-net, no host IP or port-mapping needed between the two.
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-workly}
      DATABASE_USERNAME: ${POSTGRES_USER:-workly}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-workly}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD" , "wget","-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - workly-net

  company-postgres:
    image: postgres:16-alpine
    container_name: company-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${COMPANY_POSTGRES_DB:-company}
      POSTGRES_USER: ${COMPANY_POSTGRES_USER:-company}
      POSTGRES_PASSWORD: ${COMPANY_POSTGRES_PASSWORD:-company}
    ports:
      # Host port 5434 — 5432 is taken by the native Postgres service, 5433 by the monolith's
      # own Postgres above. Container-internal port stays 5432.
      - "5434:5432"
    volumes:
      - company-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${COMPANY_POSTGRES_USER:-company} -d ${COMPANY_POSTGRES_DB:-company}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - workly-net

  company-service:
    # Same pattern as the monolith's app service — expects company-service/target/*.jar to
    # exist already. Run `./mvnw clean package -DskipTests` inside company-service/ first.
    build: ./company-service
    container_name: company-service
    restart: unless-stopped
    depends_on:
      company-postgres:
        condition: service_healthy
    environment:
      COMPANY_DATABASE_URL: jdbc:postgresql://company-postgres:5432/${COMPANY_POSTGRES_DB:-company}
      COMPANY_DATABASE_USERNAME: ${COMPANY_POSTGRES_USER:-company}
      COMPANY_DATABASE_PASSWORD: ${COMPANY_POSTGRES_PASSWORD:-company}
      # Same shared secret as the monolith's app service above — this is what lets
      # company-service verify a token the monolith's auth code issued.
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - workly-net

  job-postgres:
    image: postgres:16-alpine
    container_name: job-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${JOB_POSTGRES_DB:-job}
      POSTGRES_USER: ${JOB_POSTGRES_USER:-job}
      POSTGRES_PASSWORD: ${JOB_POSTGRES_PASSWORD:-job}
    ports:
      # Host port 5435 — 5432 is native Postgres, 5433 the monolith's, 5434 company-service's.
      # Container-internal port stays 5432.
      - "5435:5432"
    volumes:
      - job-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${JOB_POSTGRES_USER:-job} -d ${JOB_POSTGRES_DB:-job}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - workly-net

  job-service:
    # Same pattern as company-service's own service below — expects job-service/target/*.jar
    # to exist already. Run `./mvnw clean package -DskipTests` inside job-service/ first.
    build: ./job-service
    container_name: job-service
    restart: unless-stopped
    depends_on:
      job-postgres:
        condition: service_healthy
      company-service:
        condition: service_healthy
    environment:
      JOB_DATABASE_URL: jdbc:postgresql://job-postgres:5432/${JOB_POSTGRES_DB:-job}
      JOB_DATABASE_USERNAME: ${JOB_POSTGRES_USER:-job}
      JOB_DATABASE_PASSWORD: ${JOB_POSTGRES_PASSWORD:-job}
      # Same shared secret as the monolith and company-service — lets job-service verify a
      # token the monolith's auth code issued.
      JWT_SECRET: ${JWT_SECRET}
      # "company-service" is that service's name above — resolved over workly-net, no host
      # port involved. This is job-service's first real inter-service call (see
      # com.aliya.jobservice.company.CompanyClient) — a plain RestTemplate call for now, not
      # yet Eureka-discovered.
      COMPANY_SERVICE_URL: http://company-service:8082
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - workly-net

  review-postgres:
    image: postgres:16-alpine
    container_name: review-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${REVIEW_POSTGRES_DB:-review}
      POSTGRES_USER: ${REVIEW_POSTGRES_USER:-review}
      POSTGRES_PASSWORD: ${REVIEW_POSTGRES_PASSWORD:-review}
    ports:
      # Host port 5436 — 5432 is native Postgres, 5433 the monolith's, 5434 company-service's,
      # 5435 job-service's. Container-internal port stays 5432.
      - "5436:5432"
    volumes:
      - review-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${REVIEW_POSTGRES_USER:-review} -d ${REVIEW_POSTGRES_DB:-review}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - workly-net

  review-service:
    # Same pattern as job-service's own service above — expects review-service/target/*.jar
    # to exist already. Run `./mvnw clean package -DskipTests` inside review-service/ first.
    build: ./review-service
    container_name: review-service
    restart: unless-stopped
    depends_on:
      review-postgres:
        condition: service_healthy
      company-service:
        condition: service_healthy
    environment:
      REVIEW_DATABASE_URL: jdbc:postgresql://review-postgres:5432/${REVIEW_POSTGRES_DB:-review}
      REVIEW_DATABASE_USERNAME: ${REVIEW_POSTGRES_USER:-review}
      REVIEW_DATABASE_PASSWORD: ${REVIEW_POSTGRES_PASSWORD:-review}
      # Same shared secret as the monolith and the other extracted services — lets
      # review-service verify a token the monolith's auth code issued.
      JWT_SECRET: ${JWT_SECRET}
      # Same CompanyClient pattern job-service already uses — resolved over workly-net, no
      # host port involved.
      COMPANY_SERVICE_URL: http://company-service:8082
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - workly-net

volumes:
  workly-pgdata:
  company-pgdata:
  job-pgdata:
  review-pgdata:

networks:
  workly-net:
    driver: bridge
