spring.application.name=auth-service

server.port=8084

# PostgreSQL — this service's OWN database, separate from the monolith's and the other
# extracted services'. Different env var names on purpose (AUTH_DATABASE_* vs the monolith's
# DATABASE_*, COMPANY_DATABASE_*, JOB_DATABASE_*, REVIEW_DATABASE_*) so one .env can hold all five.
spring.datasource.url=${AUTH_DATABASE_URL}
spring.datasource.username=${AUTH_DATABASE_USERNAME}
spring.datasource.password=${AUTH_DATABASE_PASSWORD}
spring.jpa.database=POSTGRESQL
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Flyway (db/migration/V*.sql) owns the schema — validate just checks the entities still
# match what Flyway built, same pattern as the monolith and the other extracted services.
spring.jpa.hibernate.ddl-auto=validate

# JWT — this service is now the only issuer (see DECISIONS.md ADR-001 and ADR-011). Same
# shared secret as every other service, so a token this service signs verifies everywhere else.
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-ttl-seconds=900
app.jwt.refresh-token-ttl-seconds=604800

# Refresh-token table housekeeping (RefreshTokenCleanupJob) — same defaults as the monolith had.
app.refresh-token.cleanup-cron=0 30 3 * * *
app.refresh-token.retention-after-expiry=P7D

# First ADMIN account, created at startup by AdminBootstrapRunner. Both must be set, or nothing
# happens. Real values come from the environment, never hardcoded.
app.bootstrap-admin.email=${ADMIN_EMAIL:}
app.bootstrap-admin.password=${ADMIN_PASSWORD:}

# OAuth2 login. Real client id/secret come from the environment; the fallbacks let the app
# start without them (the provider just rejects the handshake until real values are set).
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:unset}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:unset}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:unset}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:unset}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

# company-service's base URL — UserServiceImpl.assignCompanyToUser calls GET /companies/{id}
# on it to validate a companyId, same CompanyClient pattern job-service/review-service use.
app.company-service.base-url=${COMPANY_SERVICE_URL:http://company-service:8082}
