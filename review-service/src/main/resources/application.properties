spring.application.name=review-service

server.port=8083

# PostgreSQL — this service's OWN database, separate from the monolith's and from
# company-service's/job-service's. Different env var names on purpose (REVIEW_DATABASE_* vs the
# monolith's DATABASE_*, company-service's COMPANY_DATABASE_*, job-service's JOB_DATABASE_*) so
# one .env can hold all four.
spring.datasource.url=${REVIEW_DATABASE_URL}
spring.datasource.username=${REVIEW_DATABASE_USERNAME}
spring.datasource.password=${REVIEW_DATABASE_PASSWORD}
spring.jpa.database=POSTGRESQL
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Flyway (db/migration/V*.sql) owns the schema — validate just checks the entities still
# match what Flyway built, same pattern as the monolith and the other extracted services.
spring.jpa.hibernate.ddl-auto=validate

# JWT — same shared secret as the monolith and the other extracted services (see
# DECISIONS.md ADR-001 in the main app). This service only ever verifies a token, never signs one.
app.jwt.secret=${JWT_SECRET}

# company-service's base URL — review-service calls GET /companies/{id} on it to validate a
# companyId instead of keeping its own local copy of company data, same pattern job-service
# already uses. Hardcoded-via-env-var for now; replaced by Eureka-based discovery once that
# exists (see ROADMAP.md Phase 3).
app.company-service.base-url=${COMPANY_SERVICE_URL:http://company-service:8082}
