spring.application.name=workly
spring.profiles.active=dev

server.port=8080

#PostgreSQL

spring.datasource.url =${DATABASE_URL}
spring.datasource.username =${DATABASE_USERNAME}
spring.datasource.password =${DATABASE_PASSWORD}
spring.jpa.database = POSTGRESQL
spring.jpa.show-sql = true
spring.jpa.open-in-view=false

# Flyway (db/migration/V*.sql) owns the schema now — validate just checks the entities
# still match what Flyway built, it never creates/alters/drops anything itself.
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.database-platform = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# JWT — HS256, one shared secret (see DECISIONS.md ADR-001). Real value comes from the
# environment, never hardcoded — same pattern as DATABASE_URL/_USERNAME/_PASSWORD above.
# Generate one with: openssl rand -base64 32

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-ttl-seconds=900
app.jwt.refresh-token-ttl-seconds=604800

# Refresh-token table housekeeping (RefreshTokenCleanupJob). These are the code defaults,
# repeated here for visibility — a datastore with per-key TTL (Redis) would remove this job,
# see DECISIONS.md ADR-007.
app.refresh-token.cleanup-cron=0 30 3 * * *
app.refresh-token.retention-after-expiry=P7D

app.cors.allowed-origins=http://localhost:5173,http://localhost:5174

# OAuth2 login. Real client id/secret come from the environment; the fallbacks let the app
# start without them (the provider just rejects the handshake until real values are set).

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:unset}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:unset}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:unset}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:unset}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

