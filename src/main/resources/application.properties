#PostgreSQL

spring.datasource.url =${DATABASE_URL}
spring.datasource.username =${DATABASE_USERNAME}
spring.datasource.password =${DATABASE_PASSWORD}
spring.jpa.database = POSTGRESQL
spring.jpa.show-sql = true 
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=create-drop 

#tells hibernate that schema will be created and dropped automatically when the session is created or when it is destroyed

spring.jpa.database-platform = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# JWT — HS256, one shared secret (see DECISIONS.md ADR-001). Real value comes from the
# environment, never hardcoded — same pattern as DATABASE_URL/_USERNAME/_PASSWORD above.
# Generate one with: openssl rand -base64 32

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-ttl-seconds=900
app.jwt.refresh-token-ttl-seconds=604800

# Refresh-token table housekeeping (RefreshTokenCleanupJob). These are the code defaults,
# repeated here for visibility — a datastore with per-key TTL (Redis) would remove this job,
# see DECISIONS.md ADR-007.
app.refresh-token.cleanup-cron=0 30 3 * * *
app.refresh-token.retention-after-expiry=P7D

app.cors.allowed-origins=http://localhost:5173,http://localhost:5174

# OAuth2 login (Google/GitHub) — deferred until spring-boot-starter-oauth2-client is
# uncommented in pom.xml and real client credentials exist. See ROADMAP.md Phase 2.

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email


spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

