spring.application.name=company-service

server.port=8082

# PostgreSQL — this service's OWN database, separate from the monolith's. Different env var
# names on purpose (COMPANY_DATABASE_* vs the monolith's DATABASE_*) so both apps can read the
# same .env without colliding.
spring.datasource.url=${COMPANY_DATABASE_URL}
spring.datasource.username=${COMPANY_DATABASE_USERNAME}
spring.datasource.password=${COMPANY_DATABASE_PASSWORD}
spring.jpa.database=POSTGRESQL
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Flyway (db/migration/V*.sql) owns the schema — validate just checks the entities still
# match what Flyway built, same pattern as the monolith.
spring.jpa.hibernate.ddl-auto=validate

# JWT — same shared secret as the monolith (see DECISIONS.md ADR-001 there). This service only
# ever verifies a token, never signs one.
app.jwt.secret=${JWT_SECRET}
